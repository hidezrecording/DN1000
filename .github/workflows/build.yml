# Builds DN1000 on every push and uploads downloadable plugins.
#
# Drop this into the repo at .github/workflows/build.yml, push, then:
# Actions tab -> pick a run -> download the DN1000-macOS /
# DN1000-Windows artifacts. Those contain the VST3/AU files.
#
# NOTE: macOS run is the deliverable (Nathan's Mac). Windows run kept
# for parity with the Bitey pipeline.

name: Build DN1000

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (VST3 + AU, Apple Silicon + Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.6
        run: |
          curl -L https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip -o juce.zip
          unzip -q juce.zip
          mv JUCE-8.0.6 /tmp/juce-8.0.6

      - name: Configure
        env:
          JUCE_DIR: /tmp/juce-8.0.6
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
                 -S juce

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer PKG
        run: |
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$PKGROOT/Applications"
          cp -R "build/DN1000_artefacts/Release/VST3/DN1000.vst3" "$PKGROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/DN1000_artefacts/Release/AU/DN1000.component" "$PKGROOT/Library/Audio/Plug-Ins/Components/"
          if [ -d "build/DN1000_artefacts/Release/Standalone/DN1000.app" ]; then
            cp -R "build/DN1000_artefacts/Release/Standalone/DN1000.app" "$PKGROOT/Applications/"
          fi
          # Preinstall script: remove old versions
          mkdir -p pkg_scripts
          cat > pkg_scripts/preinstall <<'SCRIPT'
#!/bin/bash
# Remove old Hamamatsu 1000 and DN1000 installations
rm -rf "/Library/Audio/Plug-Ins/VST3/Hamamatsu 1000.vst3"
rm -rf "/Library/Audio/Plug-Ins/Components/Hamamatsu 1000.component"
rm -rf "/Applications/Hamamatsu 1000.app"
rm -rf "$HOME/Library/Audio/Plug-Ins/VST3/Hamamatsu 1000.vst3"
rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Hamamatsu 1000.component"
# Remove old DN1000 (for clean reinstall)
rm -rf "/Library/Audio/Plug-Ins/VST3/DN1000.vst3"
rm -rf "/Library/Audio/Plug-Ins/Components/DN1000.component"
rm -rf "/Applications/DN1000.app"
rm -rf "$HOME/Library/Audio/Plug-Ins/VST3/DN1000.vst3"
rm -rf "$HOME/Library/Audio/Plug-Ins/Components/DN1000.component"
exit 0
SCRIPT
          chmod +x pkg_scripts/preinstall
          pkgbuild --root "$PKGROOT" \
            --identifier com.sabatinoaudio.dn1000 \
            --version 0.1.0 \
            --install-location / \
            --scripts pkg_scripts \
            DN1000-0.1.0-macOS.pkg

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: DN1000-macOS-${{ github.run_number }}
          path: build/DN1000_artefacts/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DN1000-Installer-macOS-${{ github.run_number }}
          path: DN1000-0.1.0-macOS.pkg
