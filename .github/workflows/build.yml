# Builds DN1000 on every push and uploads downloadable plugins.
#
# Drop this into the repo at .github/workflows/build.yml, push, then:
# Actions tab -> pick a run -> download the DN1000-macOS /
# DN1000-Windows artifacts. Those contain the VST3/AU files.
#
# NOTE: macOS run is the deliverable (Nathan's Mac). Windows run kept
# for parity with the Bitey pipeline.

name: Build DN1000

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (VST3 + AU, Apple Silicon + Intel)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.6
        run: |
          curl -L https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip -o juce.zip
          unzip -q juce.zip
          mv JUCE-8.0.6 /tmp/juce-8.0.6

      - name: Configure
        env:
          JUCE_DIR: /tmp/juce-8.0.6
        run: cmake -B build -G Xcode -DCMAKE_BUILD_TYPE=Release
                 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
                 -S juce

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Build installer PKG
        run: |
          PKGROOT=pkgroot
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/VST3"
          mkdir -p "$PKGROOT/Library/Audio/Plug-Ins/Components"
          mkdir -p "$PKGROOT/Applications"
          cp -R "build/DN1000_artefacts/Release/VST3/DN1000.vst3" "$PKGROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "build/DN1000_artefacts/Release/AU/DN1000.component" "$PKGROOT/Library/Audio/Plug-Ins/Components/"
          if [ -d "build/DN1000_artefacts/Release/Standalone/DN1000.app" ]; then
            cp -R "build/DN1000_artefacts/Release/Standalone/DN1000.app" "$PKGROOT/Applications/"
          fi
          pkgbuild --analyze --root "$PKGROOT" components.plist
          # Suppress bundle relocation. pkgbuild's default analysis
          # marks bundles relocatable (BundleIsRelocatable), which
          # compiles into a <relocate> entry in PackageInfo: the
          # Installer then 'upgrades' any pre-existing copy of the
          # bundle it finds ANYWHERE on disk (any mounted volume)
          # instead of writing to the PKGROOT paths above. Our
          # bundles share bundle ids (com.Sabatino Audio.DN1000), so a single stray copy
          # can capture them all while the preinstall wipes the
          # /Library copies first - successful installs can leave
          # no component in /Library at all (the Western Compressor
          # 1.1.x Luna disappearance; fixed there in 1.1.6).
          # Force BundleIsRelocatable=false on every bundle and
          # build with the component plist.
          i=0
          while /usr/libexec/PlistBuddy -c "Print :$i" components.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Set :$i:BundleIsRelocatable false" components.plist 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :$i:BundleIsRelocatable bool false" components.plist
            i=$((i + 1))
          done
          echo "BundleIsRelocatable forced false on $i bundle(s)"
          cat components.plist
          pkgbuild --root "$PKGROOT" \
            --component-plist components.plist \
            --identifier com.sabatinoaudio.dn1000 \
            --version 0.1.0 \
            --install-location / \
            --scripts pkg_scripts \
            DN1000-0.1.0-macOS.pkg

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: DN1000-macOS-${{ github.run_number }}
          path: build/DN1000_artefacts/Release/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DN1000-Installer-macOS-${{ github.run_number }}
          path: DN1000-0.1.0-macOS.pkg

  windows:
    name: Windows (VST3 + Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE 8.0.6
        run: |
          curl.exe -L https://github.com/juce-framework/JUCE/archive/refs/tags/8.0.6.zip -o juce.zip
          Expand-Archive -Path juce.zip -DestinationPath . -Force
          Move-Item -Path JUCE-8.0.6 -Destination juce-sdk

      - name: Configure
        env:
          JUCE_DIR: ${{ github.workspace }}\juce-sdk
        run: cmake -B build -S juce -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build (VST3 + Standalone targets)
        run: cmake --build build --config Release --parallel --target DN1000_VST3 DN1000_Standalone

      - name: Package ZIP
        run: |
          Compress-Archive -Path "build\DN1000_artefacts\Release\VST3\DN1000.vst3", "build\DN1000_artefacts\Release\Standalone\DN1000.exe" -DestinationPath DN1000-Windows.zip -Force
          Get-Item DN1000-Windows.zip

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: DN1000-Windows-${{ github.run_number }}
          path: DN1000-Windows.zip

      - name: Publish ZIP to windows-build branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp DN1000-Windows.zip /tmp/DN1000-Windows.zip
          git checkout -B windows-build
          mkdir -p windows
          cp /tmp/DN1000-Windows.zip windows/DN1000-Windows.zip
          git add windows/DN1000-Windows.zip
          git commit -m "Windows build (VST3 + standalone) from ${GITHUB_SHA:0:8}"
          git push --force origin windows-build
